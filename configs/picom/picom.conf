
# ============================================================================
# Backend
# ============================================================================

# Rendering backend:
#   "xrender" - XRender backend; broadly compatible, but CPU-oriented.
#   "glx"     - OpenGL backend; recommended for GPU-accelerated blur.
#   "egl"     - EGL backend; support and performance depend on the build/driver.
#
# GLX is the starting point for this NVIDIA configuration.
backend = "glx";

# Copy pixels from the front buffer instead of the back buffer.
# false avoids the additional front-buffer copy.
glx-copy-from-front = false;

# Disable stencil-buffer usage.
# Can reduce resource usage, but some rendering features may require stencil.
glx-no-stencil = true;

# Avoid rebinding pixmaps when windows change.
# May improve performance, but can cause rendering issues on some drivers.
glx-no-rebind-pixmap = true;

# Use the X Present extension's asynchronous presentation where supported.
# Disable dithering during presentation.
dithered-present = false;


# ============================================================================
# Shadows
# ============================================================================

# Draw shadows around windows.
shadow = false;

# Shadow blur radius, in pixels.
# Only relevant when shadows are enabled.
shadow-radius = 15;

# Horizontal shadow offset, in pixels.
# Negative values move the shadow to the left.
shadow-offset-x = -15;

# Vertical shadow offset, in pixels.
# Negative values move the shadow upwards.
shadow-offset-y = -15;

# Shadow opacity:
#   0.0 = fully transparent
#   1.0 = fully opaque
shadow-opacity = 1.0;

# Respect shaped-window masks when rendering shadows.
shadow-ignore-shaped = false;

# Exclude specific windows from shadow rendering.
# shadow-exclude = [
#   "class_g = 'Dunst'",
# ];


# ============================================================================
# Opacity
# ============================================================================

# Opacity of unfocused (inactive) windows.
#   0.0 = fully transparent
#   1.0 = fully opaque
inactive-opacity = 0.9;

# Opacity of the focused (active) window.
active-opacity = 0.925;

# Opacity of window frames and decorations.
frame-opacity = 0.5;

# Allow inactive-opacity to override opacity values specified by rules.
inactive-opacity-override = false;

# Dim unfocused windows:
#   0.0 = disabled
#   Higher values = stronger dimming.
inactive-dim = 0;

# Per-window opacity overrides.
# Format: "opacity:condition".
# Opacity values are percentages from 0 to 100.
opacity-rule = [
  "100:class_g = 'slop'",
  "100:class_g = 'maim'",
  "100:class_g = 'Chromium'",
  "100:class_g = 'zen-beta'",
  "100:class_g = 'Nsxiv'",
  "100:class_g = 'Inkscape'",
  "100:class_g = 'Gimp'",
  "100:class_g = 'retroarch'",
  "100:class_g = 'Gnome-mplayer'",
  "100:class_g = 'Dunst'",
  "100:class_g = 'mpv'",
  "95:class_g = 'org.pwmt.zathura'",
  "95:class_g = 'VSCodium'",
  "95:class_g = 'Tomato.C'",
  "95:class_g = 'dwm'",
  "95:class_g = 'Signal'",
  "95:class_g = 'Xarchiver'",
  "95:class_g = 'Dragon-drop'",
  "95:class_g = 'Pinentry-gtk-2'",
  "90:class_g = 'dmenu'",
  "90:class_g = 'pinentry-dmenu'",
];


# ============================================================================
# Blur
# ============================================================================

# Enable background blur behind translucent windows.
blur-background = true;

# Background blur configuration.
blur = {
  # Available methods:
  #   "none"        - Disable blur.
  #   "gaussian"    - Gaussian blur; smooth but potentially expensive.
  #   "box"         - Box blur; simpler blur implementation.
  #   "kernel"      - Custom convolution kernel.
  #   "dual_kawase" - Multi-pass blur; generally a good GPU blur choice.
  method = "dual_kawase";

  # Dual Kawase blur strength.
  # Integer range: 0-20.
  # Higher values produce stronger blur and generally more rendering work.
  strength = 2;
};

# Exclude windows from background blur.
# Useful for video, screen capture, and special-purpose windows.
blur-background-exclude = [
  "class_g = 'Gnome-mplayer'",
  "class_g = 'tray'",
  "class_g = 'mpv'",
  "class_g = 'maim'",
  "class_g = 'slop'",
];


# ============================================================================
# Fade
# ============================================================================

# Animate opacity when windows open and close.
fading = false;

# Time between fade steps, in milliseconds.
# Smaller values produce smoother, more frequent updates.
fade-delta = 5;

# Opacity increment per step when fading in.
fade-in-step = 0.1;

# Opacity decrement per step when fading out.
fade-out-step = 0.1;

# Windows excluded from fade animations.
fade-exclude = [
];


# ============================================================================
# Focus
# ============================================================================

# Consider window-manager frames focused along with their clients.
mark-wmwin-focused = true;

# Consider override-redirect windows focused.
# Relevant to menus, popups, and other unmanaged windows.
mark-ovredir-focused = true;

# Use the EWMH active-window property to determine focus.
use-ewmh-active-win = true;


# ============================================================================
# Rendering / Performance
# ============================================================================

# Redraw only damaged screen regions instead of the entire screen.
# Usually beneficial for performance.
use-damage = true;

# Enable vertical synchronization.
# false prioritizes lower latency but may cause tearing.
# true synchronizes presentation with the display refresh cycle.
vsync = false;

# Allow fullscreen windows to bypass compositing when possible.
# Can improve fullscreen performance and reduce compositor overhead.
unredir-if-possible = true;

# Delay before attempting to unredirect fullscreen windows, in milliseconds.
# unredir-if-possible-delay = 0;

# Detect transient windows.
# detect-transient = true;

# Detect client leader relationships.
# detect-client-leader = true;

# Detect rounded corners.
# detect-rounded-corners = false;

# Detect client-side opacity.
# detect-client-opacity = true;

# Use Direct Rendering Infrastructure buffer exchange.
# dbe = true;


# ============================================================================
# Window Type Settings
# ============================================================================

# Per-window-type defaults.
# These can override general shadow, fade, opacity, and focus behavior.
#
# wintypes: {
#   fullscreen = {
#     fade = false;
#     shadow = false;
#     opacity = 1.0;
#     focus = true;
#   };
# };


# ============================================================================
# XSync
# ============================================================================

# Synchronize XRender operations using XSync fences.
# Relevant to the XRender backend, not a GLX performance optimization.
# xrender-sync-fence = true;
