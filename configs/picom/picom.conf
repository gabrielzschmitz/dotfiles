# ============================================================================
# Backend
# ============================================================================

# Rendering backend: "xrender" (software, universal) or "glx" (GPU accelerated).
backend = "xrender";

# Copy pixels from the front buffer instead of the back buffer.
# false enables proper GLX compositing.
glx-copy-from-front = false;

# ============================================================================
# Shadows
# ============================================================================

# Draw shadows around windows.
shadow = false;

# Blur radius of the shadow, in pixels.
shadow-radius = 15;

# Horizontal shadow offset, in pixels (negative = to the left).
shadow-offset-x = -15;

# Vertical shadow offset, in pixels (negative = upwards).
shadow-offset-y = -15;

# Shadow opacity (0.0 fully transparent - 1.0 fully opaque).
shadow-opacity = 0.25;

# Respect shaped-window masks when drawing shadows.
shadow-ignore-shaped = false;

# ============================================================================
# Opacity
# ============================================================================

# Opacity of unfocused (inactive) windows.
inactive-opacity = 0.9;

# Opacity of the focused (active) window.
active-opacity = 0.925;

# Opacity of window frames / decorations.
frame-opacity = 0.5;

# Allow inactive-opacity to override per-window opacity rules.
inactive-opacity-override = false;

# Dim unfocused windows (0 = disabled).
inactive-dim = 0;

# Per-window opacity overrides, format "opacity:condition".
opacity-rule = [
  "100:class_g = 'slop'",
  "100:class_g = 'maim'",
  "100:class_g = 'Chromium'",
  "100:class_g = 'zen-beta'",
  "100:class_g = 'maim'",
  "100:class_g = 'Nsxiv'",
  "100:class_g = 'Inkscape'",
  "100:class_g = 'Gimp'",
  "100:class_g = 'retroarch'",
  "100:class_g = 'Gnome-mplayer'",
  "100:class_g = 'Dunst'",
  "100:class_g = 'mpv'",
  "95:class_g = 'org.pwmt.zathura'",
  "95:class_g = 'VSCodium'",
  "95:class_g = 'Tomato.C'",
  "95:class_g = 'dwm'",
  "95:class_g = 'Signal'",
  "95:class_g = 'Xarchiver'",
  "95:class_g = 'Dragon-drop'",
  "95:class_g = 'Pinentry-gtk-2'",
  "95:class_g = 'dmenu'"
];

# ============================================================================
# Blur
# ============================================================================

# Enable background blur behind translucent windows.
blur-background = false;

# Blur method and intensity.
blur = {
  method = "dual_kawase";
  strength = 2.5;
};

# Windows excluded from background blur.
blur-background-exclude = [
  "class_g = 'Gnome-mplayer'",
  "class_g = 'tray'",
  "class_g = 'mpv'",
  "class_g = 'maim'",
  "class_g = 'slop'"
];

# ============================================================================
# Fade
# ============================================================================

# Fade windows in/out when opening/closing.
fading = false;

# Time between steps of a fade, in milliseconds.
fade-delta = 5;

# Opacity increment per step when fading in.
fade-in-step = 0.1;

# Opacity decrement per step when fading out.
fade-out-step = 0.1;

# Windows excluded from fading.
fade-exclude = [
];

# ============================================================================
# Focus
# ============================================================================

# Consider wm windows (frames) focused along with their client.
mark-wmwin-focused = true;

# Mark override-redirect windows as focused.
mark-ovredir-focused = true;

# Use the EWMH active window hint to determine focus.
use-ewmh-active-win = true;

# ============================================================================
# Other
# ============================================================================

#detect-rounded-corners = false;
#detect-client-opacity = true;
#vsync = "opengl";
#dbe = true;
# unredir-if-possible = true;
# unredir-if-possible-delay = 0;
# detect-transient = true;
#detect-client-leader = true;

